services:
  postgres:
    image: postgres:16-alpine
    container_name: firewall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: firewall_user
      POSTGRES_PASSWORD: firewall_password
      POSTGRES_DB: firewall_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewall_user -d firewall_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firewall-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "AI Prompt Injection and Jailbreak Detection Firewall"
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://firewall_user:firewall_password@postgres:5432/firewall_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-super-secret-key-for-prod-deployment}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: "http://localhost:80,http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - backend_artifacts:/app/app/ml/artifacts
      - backend_reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firewall-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_artifacts:
  backend_reports:
